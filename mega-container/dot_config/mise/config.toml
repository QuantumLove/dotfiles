[tools]
node = "26.7.0"
bun = "latest"
"npm:pnpm" = "latest"
python = "3.14"
go = "latest"
age = "latest"
sops = "latest"
gitleaks = "latest"
tflint = "latest"
"asdf:virtualroot/asdf-opentofu" = "latest"
"asdf:asdf-community/asdf-kubectl" = "latest"
"asdf:sudermanjr/asdf-yq" = "latest"
"asdf:asdf-community/asdf-uv" = "latest"
"asdf:looztra/asdf-k9s" = "latest"
"asdf:MetricMike/asdf-awscli" = "latest"
# matching=musl: the repo also ships a `tt-watcher` GUI build (needs libxkbcommon);
# without this filter mise picks that instead of the headless `tt` CLI.
"github:sjawhar/time-tracker" = { version = "latest", exe = "tt", matching = "musl" }
# omp (oh-my-pi). Exact version, not "latest": upstream releases roughly daily,
# so latest would change the agent under you between rebuilds. No architecture
# filter — this container is arm64 and ubi detects the platform; naming
# linux-x64 would match nothing. See docs/vendored/oh-my-pi.md.
"github:can1357/oh-my-pi" = { version = "18.0.11", exe = "omp" }
# NB: opencode-ai, @anthropic-ai/claude-code, oh-my-openagent, @googleworkspace/cli,
# yarn are installed via npm-global in the Dockerfile rather than here, because
# mise's npm backend doesn't run postinstall scripts (needed for platform binaries).

[settings]
experimental = true
yes = true
lockfile = true

[env]
EDITOR = "vim"
